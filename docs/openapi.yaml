        "400":
          description: Validation error (name missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/me:
    get:
      operationId: getMe
      tags: [Authentication]
      summary: Get current developer profile
      responses:
        "200":
          description: Developer profile
          content:
            application/json:
