          description: Invalid SCIM token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createScimUser
      tags: [SCIM]
      summary: Create a SCIM user
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                displayName:
                  type: string
                externalId:
                  type: string
                active:
                  type: boolean
                  default: true
                emails:
                  type: array
                  items:
                    type: object
                    properties:
                      value:
                        type: string
                      primary:
                        type: boolean
              required: [userName]
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: userName missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid SCIM token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scim/v2/Users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: SCIM user ID
    get:
      operationId: getScimUser
      tags: [SCIM]
      summary: Get SCIM user by ID
      security:
        - scimBearer: []
      responses:
        "200":
          description: SCIM user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401":
          description: Invalid SCIM token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: replaceScimUser
      tags: [SCIM]
      summary: Replace a SCIM user
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                displayName:
                  type: string
                externalId:
                  type: string
                active:
                  type: boolean
                emails:
                  type: array
                  items:
                    type: object
                    properties:
                      value:
                        type: string
                      primary:
                        type: boolean
              required: [userName]
      responses:
        "200":
          description: User replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid SCIM token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateScimUser
      tags: [SCIM]
      summary: Patch a SCIM user
      security:
        - scimBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Operations:
                  type: array
                  items:
                    type: object
                    properties:
                      op:
                        type: string
                        enum: [replace, add]
                      path:
                        type: string
                      value: {}
              required: [Operations]
      responses:
        "200":
          description: User patched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScimUser"
        "401":
          description: Invalid SCIM token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteScimUser
      tags: [SCIM]
      summary: Delete a SCIM user
      security:
        - scimBearer: []
      responses:
        "204":
          description: User deleted
        "401":
          description: Invalid SCIM token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

