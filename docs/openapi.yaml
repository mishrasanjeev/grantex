          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
              required: [label]
      responses:
        "201":
          description: SCIM token created (token value returned only on creation)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  token:
                    type: string
                    description: Only returned on creation
                  createdAt:
                    type: string
                    format: date-time
        "400":
          description: Label missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listScimTokens
      tags: [SCIM]
      summary: List SCIM tokens
      responses:
        "200":
          description: Token list (token values not included)
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        lastUsedAt:
                          type: string
                          format: date-time

  /v1/scim/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: SCIM token ID
    delete:
      operationId: deleteScimToken
      tags: [SCIM]
      summary: Delete a SCIM token
      responses:
        "204":
          description: Token deleted
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /scim/v2/ServiceProviderConfig:
    get:
      operationId: getScimServiceProviderConfig
      tags: [SCIM]
      summary: SCIM service provider configuration
      security: []
      responses:
        "200":
          description: SCIM capabilities
          content:
            application/json:
              schema:
                type: object

  /scim/v2/Users:
    get:
      operationId: listScimUsers
      tags: [SCIM]
      summary: List SCIM users
      security:
        - scimBearer: []
      parameters:
        - name: startIndex
          in: query
          schema:
            type: integer
            default: 1
        - name: count
          in: query
          schema:
            type: integer
            default: 100
            maximum: 200
      responses:
        "200":
          description: SCIM user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  schemas:
                    type: array
                    items:
                      type: string
                  totalResults:
                    type: integer
