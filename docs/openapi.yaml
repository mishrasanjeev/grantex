                $ref: "#/components/schemas/Developer"
        "404":
          description: Developer not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateSettings
      tags: [Authentication]
      summary: Update developer settings
      description: Update developer profile settings including FIDO/WebAuthn configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fidoRequired:
                  type: boolean
                  description: Require FIDO2/WebAuthn assertion for all authorization requests
                fidoRpName:
                  type: string
                  description: Relying Party name displayed in browser passkey prompts
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Developer"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/keys/rotate:
    post:
      operationId: rotateApiKey
      tags: [Authentication]
      summary: Rotate API key
      description: Generates a new API key and invalidates the current one.
      responses:
        "200":
          description: New API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: string
                  rotatedAt:
                    type: string
                    format: date-time

  # ── Agents ───────────────────────────────────────────────────────────
  /v1/agents:
    post:
      operationId: registerAgent
      tags: [Agents]
      summary: Register a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Human-readable agent name
                description:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                  description: Scopes the agent may request
              required: [name]
      responses:
        "201":
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
