      summary: Configure OIDC SSO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                issuerUrl:
                  type: string
                  format: uri
                clientId:
                  type: string
                clientSecret:
                  type: string
                redirectUri:
                  type: string
                  format: uri
              required: [issuerUrl, clientId, clientSecret, redirectUri]
      responses:
        "201":
          description: SSO configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuerUrl:
                    type: string
                  clientId:
                    type: string
                  redirectUri:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getSsoConfig
      tags: [SSO]
      summary: Get SSO configuration
      description: Returns SSO config with client secret masked.
      responses:
        "200":
          description: SSO configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuerUrl:
                    type: string
                  clientId:
                    type: string
                  redirectUri:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
        "404":
          description: SSO not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSsoConfig
      tags: [SSO]
      summary: Remove SSO configuration
      responses:
        "204":
          description: SSO config removed
        "404":
          description: SSO not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sso/login:
    get:
      operationId: ssoLogin
      tags: [SSO]
      summary: Initiate SSO login
      security: []
      parameters:
        - name: org
          in: query
          required: true
          schema:
            type: string
          description: Developer ID (organization)
      responses:
        "200":
          description: OIDC authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorizeUrl:
                    type: string
                    format: uri
        "400":
          description: org parameter missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: SSO not configured for this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sso/callback:
    get:
      operationId: ssoCallback
      tags: [SSO]
      summary: SSO callback
      description: OIDC callback endpoint. Exchanges the authorization code for user info.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSO user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  name:
                    type: string
                  sub:
                    type: string
                  developerId:
                    type: string
        "400":
          description: Missing or invalid code/state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Token exchange with IdP failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Enterprise SSO ─────────────────────────────────────────────────
  /v1/sso/connections:
    post:
      operationId: createSsoConnection
      tags: [SSO]
      summary: Create SSO Connection
      description: Create a new OIDC or SAML 2.0 SSO connection for your organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Human-readable connection name
                protocol:
                  type: string
                  enum: [oidc, saml]
                  description: SSO protocol
                issuerUrl:
                  type: string
                  format: uri
                  description: OIDC issuer URL (required for OIDC)
                clientId:
                  type: string
                  description: OIDC client ID (required for OIDC)
                clientSecret:
                  type: string
                  description: OIDC client secret (required for OIDC)
                idpEntityId:
                  type: string
                  description: SAML IdP entity ID (required for SAML)
                idpSsoUrl:
                  type: string
                  format: uri
                  description: SAML IdP SSO URL (required for SAML)
                idpCertificate:
                  type: string
                  description: SAML IdP X.509 certificate PEM (required for SAML)
                spEntityId:
                  type: string
                  description: SAML SP entity ID
                spAcsUrl:
                  type: string
                  format: uri
                  description: SAML SP Assertion Consumer Service URL
                domains:
                  type: array
                  items:
                    type: string
                  description: Email domains to route to this connection
                jitProvisioning:
                  type: boolean
                  description: Enable just-in-time user provisioning
                  default: false
                enforce:
                  type: boolean
                  description: Enforce SSO for this connection
                  default: false
                groupAttribute:
                  type: string
                  description: OIDC claim or SAML attribute containing group names
                groupMappings:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                  description: Map of IdP group names to Grantex scope arrays
                defaultScopes:
                  type: array
                  items:
                    type: string
                  description: Fallback scopes when no groups match
              required: [name, protocol]
      responses:
        "201":
          description: SSO connection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoConnection"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listSsoConnections
      tags: [SSO]
      summary: List SSO Connections
      description: List all SSO connections for the authenticated developer.
      responses:
        "200":
          description: List of SSO connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/SsoConnection"

  /v1/sso/connections/{id}:
    patch:
      operationId: updateSsoConnection
      tags: [SSO]
      summary: Update SSO Connection
      description: Update an existing SSO connection. All body parameters are optional.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: SSO connection ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                protocol:
                  type: string
                  enum: [oidc, saml]
                issuerUrl:
                  type: string
                  format: uri
                clientId:
                  type: string
                clientSecret:
                  type: string
                idpEntityId:
                  type: string
                idpSsoUrl:
                  type: string
                  format: uri
                idpCertificate:
                  type: string
                spEntityId:
                  type: string
                spAcsUrl:
                  type: string
                  format: uri
                domains:
                  type: array
                  items:
                    type: string
                jitProvisioning:
                  type: boolean
                enforce:
                  type: boolean
                groupAttribute:
                  type: string
                groupMappings:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
                defaultScopes:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: SSO connection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoConnection"
        "404":
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSsoConnection
      tags: [SSO]
      summary: Delete SSO Connection
      description: Delete an SSO connection by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: SSO connection ID
      responses:
        "204":
          description: SSO connection deleted
        "404":
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/sso/connections/{id}/test:
    post:
      operationId: testSsoConnection
      tags: [SSO]
      summary: Test SSO Connection
      description: Test an SSO connection by verifying connectivity to the identity provider. For OIDC, discovers endpoints via `.well-known/openid-configuration`. For SAML, validates the certificate.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: SSO connection ID
      responses:
        "200":
          description: Connection test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  protocol:
                    type: string
                    enum: [oidc, saml]
                  issuer:
                    type: string
                    description: OIDC issuer (present for OIDC connections)
                  authorizationEndpoint:
                    type: string
                    description: OIDC authorization endpoint (present for OIDC connections)
                  tokenEndpoint:
                    type: string
                    description: OIDC token endpoint (present for OIDC connections)
                  jwksUri:
                    type: string
                    description: OIDC JWKS URI (present for OIDC connections)
                  idpEntityId:
                    type: string
                    description: SAML IdP entity ID (present for SAML connections)
                  certificateValid:
                    type: boolean
                    description: Whether the SAML certificate is valid (present for SAML connections)
                  certificateExpiry:
                    type: string
                    format: date-time
                    description: SAML certificate expiry date (present for SAML connections)
        "404":
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: IdP unreachable or discovery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/sso/enforce:
    post:
      operationId: setSsoEnforcement
      tags: [SSO]
      summary: Set SSO Enforcement
      description: Enable or disable SSO enforcement for your organization. When enabled, all users must authenticate via SSO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enforce:
                  type: boolean
                  description: Whether to enforce SSO for all users
              required: [enforce]
      responses:
        "200":
          description: SSO enforcement updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  enforce:
                    type: boolean
                  developerId:
                    type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/sso/sessions:
    get:
      operationId: listSsoSessions
      tags: [SSO]
      summary: List SSO Sessions
      description: List all active SSO sessions for the authenticated developer.
      responses:
        "200":
          description: List of active SSO sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/SsoSession"

  /v1/sso/sessions/{id}:
    delete:
      operationId: revokeSsoSession
      tags: [SSO]
      summary: Revoke SSO Session
      description: Revoke an active SSO session by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: SSO session ID
      responses:
        "204":
          description: SSO session revoked
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sso/callback/oidc:
    post:
      operationId: oidcCallback
      tags: [SSO]
      summary: OIDC Callback
      description: Handle the OIDC callback after the user authenticates with the identity provider. Exchanges the authorization code for an ID token, verifies the token signature via JWKS, extracts user info, maps groups to scopes, and optionally provisions the user via JIT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Authorization code from the IdP
                state:
                  type: string
                  description: State parameter for CSRF protection
                redirect_uri:
                  type: string
                  format: uri
                  description: Redirect URI (must match the one used in the authorize request)
              required: [code, state]
      responses:
        "200":
          description: SSO callback result with session and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoCallbackResult"
        "400":
          description: Missing or invalid code/state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Token exchange with IdP failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sso/callback/saml:
    post:
      operationId: samlCallback
      tags: [SSO]
      summary: SAML Callback
      description: Handle the SAML 2.0 callback after the user authenticates with the identity provider. Parses the SAML response, verifies the XML signature against the IdP certificate, extracts user attributes, maps groups to scopes, and optionally provisions the user via JIT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                  description: Base64-encoded SAML response from the IdP
                RelayState:
                  type: string
                  description: RelayState parameter for maintaining application state
              required: [SAMLResponse, RelayState]
      responses:
        "200":
          description: SSO callback result with session and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoCallbackResult"
        "400":
          description: Invalid SAML response or signature verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sso/callback/ldap:
    post:
      operationId: ldapCallback
      tags: [SSO]
      summary: LDAP Callback
      description: >-
        Authenticate a user with the current LDAP direct-bind preview and create
        an SSO session. The built-in client binds the configured service account,
        constructs a user DN from the configured filter and search base, then
        binds that DN with the submitted password. It does not perform directory,
        attribute, or group searches. The response has no email or display name,
        uses an empty groups list, and therefore returns only configured default
        scopes. JIT provisioning may still be applied when enabled. Validate the
        exact DN convention against a staging directory.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username interpolated into the configured filter to construct the user DN; the preview does not search
                  example: alice
                password:
                  type: string
                  format: password
                  description: The user's LDAP password for bind authentication
                connectionId:
                  type: string
                  description: The SSO connection ID for the LDAP directory
                  example: sso_conn_03HX...
                org:
                  type: string
                  description: Organization/developer identifier that owns the LDAP connection
                  example: dev_01HXYZ...
              required: [username, password, connectionId, org]
      responses:
        "200":
          description: SSO callback result with session and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SsoCallbackResult"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: LDAP authentication failed, including bind or connectivity errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Dashboard ────────────────────────────────────────────────────────
  /dashboard:
    get:
      operationId: getDashboard
      tags: [System]
      summary: Developer dashboard
      description: Lightweight HTML dashboard for local development.
      security: []
      responses:
        "200":
          description: HTML dashboard
          content:
            text/html:
              schema:
                type: string

  /v1/principal-sessions:
    post:
      operationId: createPrincipalSession
      tags: [Principal Sessions]
      summary: Create a principal session
      description: |
        Generate a short-lived session token for an end-user to view and manage their agent permissions.
        The returned `dashboardUrl` can be sent to the user (via email, in-app link, etc.).
        Requires at least one active grant for the specified principal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalId]
              properties:
                principalId:
                  type: string
                  description: The end-user's principal ID
                  example: user_abc123
                expiresIn:
                  type: string
                  description: Session duration (e.g. "1h", "30m", "24h"). Defaults to "1h", capped at "24h".
                  example: "2h"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionToken:
                    type: string
                    description: Signed JWT session token
                  dashboardUrl:
                    type: string
                    description: Full URL the user can open to manage permissions
                  expiresAt:
                    type: string
                    format: date-time
                    description: When the session token expires
        "400":
          description: Missing principalId or invalid expiresIn
        "404":
          description: No active grants for this principal

  /v1/principal/grants:
    get:
      operationId: listPrincipalGrants
      tags: [Principal Sessions]
      summary: List principal's active grants
      description: |
        Returns all active grants for the authenticated principal. Requires a session token
        (from `POST /v1/principal-sessions`) in the Authorization header.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: "Bearer <sessionToken>"
      responses:
        "200":
          description: List of active grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      type: object
                      properties:
                        grantId:
                          type: string
                        agentId:
                          type: string
                        agentName:
                          type: string
                        agentDescription:
                          type: string
                        agentDid:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                        status:
                          type: string
                        issuedAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time
                        delegationDepth:
                          type: integer
                  principalId:
                    type: string
        "401":
          description: Missing, invalid, or expired session token

  /v1/principal/audit:
    get:
      operationId: getPrincipalAudit
      tags: [Principal Sessions]
      summary: Get principal's audit log
      description: |
        Returns recent audit entries for the authenticated principal. Requires a session token.
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: "Bearer <sessionToken>"
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        entryId:
                          type: string
                        agentId:
                          type: string
                        agentDid:
                          type: string
                        grantId:
                          type: string
                        principalId:
                          type: string
                        action:
                          type: string
                        metadata:
                          type: object
                        status:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        "401":
          description: Missing, invalid, or expired session token

  /v1/principal/grants/{id}:
    delete:
      operationId: revokePrincipalGrant
      tags: [Principal Sessions]
      summary: Revoke a grant
      description: |
        Revoke a specific grant. The grant must belong to the authenticated principal and developer.
        Cascade-revokes all descendant (delegated) grants. Requires a session token.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The grant ID to revoke
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: "Bearer <sessionToken>"
      responses:
        "204":
          description: Grant revoked
        "401":
          description: Missing, invalid, or expired session token
        "404":
          description: Grant not found or does not belong to this principal

  /dashboard/principal:
    get:
      operationId: getPrincipalDashboard
      tags: [System]
      summary: Principal permissions dashboard
      description: HTML page for managing principal (end-user) permissions.
      security: []
      parameters:
        - name: id
          in: query
          schema:
            type: string
          description: Principal ID for prefill
      responses:
        "200":
          description: HTML principal dashboard
          content:
            text/html:
              schema:
                type: string

  # ── WebAuthn / FIDO ──────────────────────────────────────────────────
  /v1/webauthn/register/options:
    post:
      operationId: webauthnRegisterOptions
      tags: [WebAuthn]
      summary: Generate registration options
      description: |
        Generate FIDO2/WebAuthn registration options for a principal. Returns a challenge and
        PublicKeyCredentialCreationOptions that the browser passes to navigator.credentials.create().
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalId]
              properties:
                principalId:
                  type: string
                  description: The end-user's principal ID
                  example: user_abc123
      responses:
        "200":
          description: Registration options
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId:
                    type: string
                    description: Server-side challenge reference
                  challenge:
                    type: string
                    description: Base64url-encoded challenge
                  rp:
                    type: object
                    properties:
                      name:
                        type: string
                      id:
                        type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      displayName:
                        type: string
                  pubKeyCredParams:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        alg:
                          type: integer
                  authenticatorSelection:
                    type: object
                    properties:
                      userVerification:
                        type: string
                        enum: [required]
                  timeout:
                    type: integer
        "400":
          description: Missing principalId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/webauthn/register/verify:
    post:
      operationId: webauthnRegisterVerify
      tags: [WebAuthn]
      summary: Verify registration
      description: |
        Verify the attestation response from navigator.credentials.create() and store the credential.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, response]
              properties:
                challengeId:
                  type: string
                  description: The challengeId from registerOptions
                response:
                  type: object
                  description: The credential response from the browser
                  properties:
                    id:
                      type: string
                    rawId:
                      type: string
                    type:
                      type: string
                    response:
                      type: object
                      properties:
                        clientDataJSON:
                          type: string
                        attestationObject:
                          type: string
      responses:
        "201":
          description: Credential registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentialId:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
        "400":
          description: Invalid challenge or attestation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/webauthn/credentials:
    get:
      operationId: listWebAuthnCredentials
      tags: [WebAuthn]
      summary: List WebAuthn credentials
      description: List all registered FIDO2 credentials for a principal.
      parameters:
        - name: principalId
          in: query
          required: true
          schema:
            type: string
          description: The principal ID to list credentials for
      responses:
        "200":
          description: List of credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    principalId:
                      type: string
                    authenticatorType:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    lastUsedAt:
                      type: string
                      format: date-time

  /v1/webauthn/credentials/{id}:
    delete:
      operationId: deleteWebAuthnCredential
      tags: [WebAuthn]
      summary: Delete a credential
      description: Remove a registered FIDO2 credential.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credential ID
      responses:
        "204":
          description: Credential deleted
        "404":
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/webauthn/assert/options:
    post:
      operationId: webauthnAssertOptions
      tags: [WebAuthn]
      summary: Generate assertion options
      description: |
        Generate FIDO2/WebAuthn assertion options for the consent flow. Returns a challenge and
        PublicKeyCredentialRequestOptions that the browser passes to navigator.credentials.get().
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principalId, authRequestId]
              properties:
                principalId:
                  type: string
                  description: The end-user's principal ID
                authRequestId:
                  type: string
                  description: The authorization request ID this assertion is for
      responses:
        "200":
          description: Assertion options
          content:
            application/json:
              schema:
                type: object
                properties:
                  challengeId:
                    type: string
                  challenge:
                    type: string
                  allowCredentials:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                  userVerification:
                    type: string
                    enum: [required]
                  timeout:
                    type: integer
        "400":
          description: Missing parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No credentials registered for this principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/webauthn/assert/verify:
    post:
      operationId: webauthnAssertVerify
      tags: [WebAuthn]
      summary: Verify assertion
      description: |
        Verify the assertion response from navigator.credentials.get(). On success, the associated
        authorization request is approved with FIDO evidence attached to the grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeId, response]
              properties:
                challengeId:
                  type: string
                response:
                  type: object
                  properties:
                    id:
                      type: string
                    rawId:
                      type: string
                    type:
                      type: string
                    response:
                      type: object
                      properties:
                        clientDataJSON:
                          type: string
                        authenticatorData:
                          type: string
                        signature:
                          type: string
      responses:
        "200":
          description: Assertion verified, grant approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                  grantId:
                    type: string
                  fidoEvidence:
                    type: object
                    properties:
                      credentialId:
                        type: string
                      authenticatorType:
                        type: string
                      userVerified:
                        type: boolean
                      assertedAt:
                        type: string
                        format: date-time
        "400":
          description: Invalid assertion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Verifiable Credentials ──────────────────────────────────────────
  /v1/credentials/{id}:
    get:
      operationId: getCredential
      tags: [Verifiable Credentials]
      summary: Retrieve a Verifiable Credential
      description: Get a specific Verifiable Credential by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Credential ID
      responses:
        "200":
          description: Verifiable Credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  grantId:
                    type: string
                  type:
                    type: string
                    enum: [AgentGrantCredential, DelegatedGrantCredential]
                  vcJwt:
                    type: string
                    description: The VC-JWT string
                  status:
                    type: string
                    enum: [active, revoked]
                  issuedAt:
                    type: string
                    format: date-time
                  expiresAt:
                    type: string
                    format: date-time
        "404":
          description: Credential not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/credentials:
    get:
      operationId: listCredentials
      tags: [Verifiable Credentials]
      summary: List Verifiable Credentials
      description: List credentials with optional filters.
      parameters:
        - name: grantId
          in: query
          schema:
            type: string
          description: Filter by grant ID
        - name: principalId
          in: query
          schema:
            type: string
          description: Filter by principal ID
        - name: status
          in: query
          schema:
            type: string
            enum: [active, revoked]
          description: Filter by status
      responses:
        "200":
          description: List of credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        grantId:
                          type: string
                        type:
                          type: string
                        status:
                          type: string
                        issuedAt:
                          type: string
                          format: date-time
                        expiresAt:
                          type: string
                          format: date-time

  /v1/credentials/verify:
    post:
      operationId: verifyCredential
      tags: [Verifiable Credentials]
      summary: Verify a VC-JWT
      description: |
        Verify a Verifiable Credential JWT. Checks the signature against the issuer's DID document,
        validates expiry, and checks the StatusList2021 revocation status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vcJwt]
              properties:
                vcJwt:
                  type: string
                  description: The VC-JWT to verify
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  issuer:
                    type: string
                  credentialSubject:
                    type: object
                  status:
                    type: string
                    enum: [active, revoked]
                  reason:
                    type: string
                    description: Present when valid is false

  /v1/credentials/status/{id}:
    get:
      operationId: getStatusList
      tags: [Verifiable Credentials]
      summary: StatusList2021 credential
      description: |
        Public endpoint returning a StatusList2021 credential (bitstring-based revocation list).
        No authentication required.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Status list ID
      responses:
        "200":
          description: StatusList2021 credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@context":
                    type: array
                    items:
                      type: string
                  type:
                    type: array
                    items:
                      type: string
                  issuer:
                    type: string
                  issuanceDate:
                    type: string
                    format: date-time
                  credentialSubject:
                    type: object
                    properties:
                      id:
                        type: string
                      type:
                        type: string
                      statusPurpose:
                        type: string
                      encodedList:
                        type: string
                        description: Base64-encoded bitstring
        "404":
          description: Status list not found

  # ── DID ──────────────────────────────────────────────────────────────
  /.well-known/did.json:
    get:
      operationId: getDidDocument
      tags: [DID]
      summary: W3C DID document
      description: |
        Public DID document for did:web:grantex.dev. Contains verification methods (public keys)
        used to sign Verifiable Credentials. No authentication required.
      security: []
      responses:
        "200":
          description: DID document
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@context":
                    type: array
                    items:
                      type: string
                  id:
                    type: string
                    example: "did:web:grantex.dev"
                  verificationMethod:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        controller:
                          type: string
                        publicKeyJwk:
                          type: object
                  authentication:
                    type: array
                    items:
                      type: string
                  assertionMethod:
                    type: array
                    items:
                      type: string
                  service:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        serviceEndpoint:
                          type: string

  # ─── Events ────────────────────────────────────────────────────────────────────

  /v1/events/stream:
    get:
      operationId: eventStream
      tags: [Events]
      summary: Server-Sent Events stream
      description: |
        Opens a persistent SSE connection that receives real-time events for the authenticated developer.
        Events are forwarded from the Redis pub/sub channel `grantex:events:{developerId}`.

        **Max 5 concurrent SSE connections per developer.**

        Send a `types` query parameter (comma-separated) to filter by event type.
        The stream sends `: keepalive` comments every 30 seconds to prevent timeouts.
      security:
        - bearerAuth: []
      parameters:
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated event types to filter (e.g. `grant.created,token.issued`)
      responses:
        "200":
          description: SSE stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: "Newline-delimited SSE events (`data: {JSON}\\n\\n`)"
        "429":
          description: Too many concurrent connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string
                    example: TOO_MANY_CONNECTIONS

  /v1/events/ws:
    get:
      operationId: eventWebSocket
      tags: [Events]
      summary: WebSocket event stream
      description: |
        Opens a WebSocket connection that receives real-time events for the authenticated developer.
        Events are forwarded from the Redis pub/sub channel `grantex:events:{developerId}`.

        **Max 5 concurrent WebSocket connections per developer.**

        Send a JSON message `{ "types": ["grant.created", "token.issued"] }` to filter event types dynamically.
        The server sends WebSocket pings every 30 seconds as keepalive.
      security:
        - bearerAuth: []
      responses:
        "101":
          description: WebSocket upgrade successful. Close code 1013 is sent if too many connections.
        "429":
          description: Too many connections

  # ─── Email Verification ────────────────────────────────────────────────────────

  /v1/signup/verify:
    post:
      operationId: sendVerificationEmail
      tags: [Authentication]
      summary: Send verification email
      description: |
        Sends a verification email to the specified address. The email contains a link
        with a unique token that expires after 24 hours. The developer must be authenticated.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to verify
              required: [email]
      responses:
        "201":
          description: Verification email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification email sent
                  expiresAt:
                    type: string
                    format: date-time
                    description: When the verification token expires
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/signup/verify/{token}:
    get:
      operationId: verifyEmailToken
      tags: [Authentication]
      summary: Verify email token
      description: |
        Verifies an email verification token received via email. This is a public endpoint
        (no authentication required). On success, marks the developer's email as verified.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Verification token from the email link
      responses:
        "200":
          description: Email verified successfully (or already verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verified successfully
        "400":
          description: Token expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Policy Sync & Bundles ─────────────────────────────────────────────────────

  /v1/policies/sync:
    post:
      operationId: syncPolicyBundle
      tags: [Policies]
      summary: Upload a policy bundle
      description: |
        Uploads a policy bundle (Rego or Cedar format) as base64-encoded content.
        The bundle can optionally be activated immediately.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [rego, cedar]
                  description: Policy language format
                version:
                  type: string
                  description: Semantic version of the bundle
                content:
                  type: string
                  description: Base64-encoded bundle content
                fileCount:
                  type: integer
                  description: Number of files in the bundle (default 1)
                activate:
                  type: boolean
                  description: Whether to activate the bundle immediately (default true)
              required: [format, version, content]
      responses:
        "201":
          description: Policy bundle uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundleId:
                    type: string
                  format:
                    type: string
                  version:
                    type: string
                  sha256:
                    type: string
                  fileCount:
                    type: integer
                  activated:
                    type: boolean
        "400":
          description: Invalid format, missing fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/policies/bundles:
    get:
      operationId: listPolicyBundles
      tags: [Policies]
      summary: List policy bundles
      description: |
        Returns all policy bundles uploaded by the authenticated developer.
        Optionally filter by format (rego or cedar).
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [rego, cedar]
          description: Filter by policy language format
      responses:
        "200":
          description: List of policy bundles
          content:
            application/json:
              schema:
                type: object
                properties:
                  bundles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        format:
                          type: string
                        version:
                          type: string
                        fileCount:
                          type: integer
                        active:
                          type: boolean
                        uploadedAt:
                          type: string
                          format: date-time

  /v1/policies/bundles/active:
    get:
      operationId: getActivePolicyBundle
      tags: [Policies]
      summary: Get active policy bundle
      description: |
        Returns the currently active policy bundle for the specified format.
        Returns 404 if no active bundle exists for the given format.
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [rego, cedar]
          description: Policy language format (required)
      responses:
        "200":
          description: Active policy bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  format:
                    type: string
                  version:
                    type: string
                  fileCount:
                    type: integer
                  active:
                    type: boolean
                  uploadedAt:
                    type: string
                    format: date-time
        "400":
          description: Missing or invalid format parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No active bundle found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/policies/sync/webhook:
    post:
      operationId: policySyncWebhook
      tags: [Policies]
      summary: Git webhook trigger for policy sync
      description: |
        Receives a git webhook payload (e.g. from GitHub/GitLab push events) to trigger
        policy bundle synchronization. Intended for CI/CD pipeline integration.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
                  description: Git ref (e.g. `refs/heads/main`)
                repository:
                  type: object
                  properties:
                    full_name:
                      type: string
                      description: Repository full name (e.g. `org/repo`)
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Webhook received
                  ref:
                    type: string
                  repository:
                    type: string

  # ─── Anomaly Alerts ────────────────────────────────────────────────────────────

  /v1/anomaly/alerts:
    get:
      operationId: listAnomalyAlerts
      tags: [Anomalies]
      summary: List anomaly alerts
      description: |
        Returns anomaly alerts with optional filters for status, severity, and agent.
        Results are ordered by detection time (newest first).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, acknowledged, resolved]
          description: Filter by alert status
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [critical, high, medium, low]
          description: Filter by severity level
        - name: agentId
          in: query
          required: false
          schema:
            type: string
          description: Filter by agent ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
          description: Maximum number of alerts to return
      responses:
        "200":
          description: List of anomaly alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        alertId:
                          type: string
                        ruleId:
                          type: string
                          nullable: true
                        ruleName:
                          type: string
                        severity:
                          type: string
                          enum: [critical, high, medium, low]
                        status:
                          type: string
                          enum: [open, acknowledged, resolved]
                        agentId:
                          type: string
                          nullable: true
                        detectedAt:
                          type: string
                          format: date-time
                        description:
                          type: string
                        context:
                          type: object
                        acknowledgedAt:
                          type: string
                          format: date-time
                          nullable: true
                        resolvedAt:
                          type: string
                          format: date-time
                          nullable: true

  /v1/anomaly/alerts/{alertId}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [Anomalies]
      summary: Acknowledge an anomaly alert
      description: |
        Marks an anomaly alert as acknowledged. Optionally include a resolution note.
      security:
        - bearerAuth: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
          description: Alert ID to acknowledge
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Optional resolution note
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  alertId:
                    type: string
                  ruleId:
                    type: string
                    nullable: true
                  ruleName:
                    type: string
                  severity:
                    type: string
                  status:
                    type: string
                    example: acknowledged
                  agentId:
                    type: string
                    nullable: true
                  detectedAt:
                    type: string
                    format: date-time
                  description:
                    type: string
                  context:
                    type: object
                  acknowledgedAt:
                    type: string
                    format: date-time
                  resolvedAt:
                    type: string
                    format: date-time
                    nullable: true
        "404":
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/anomaly/alerts/{alertId}/resolve:
    post:
      operationId: resolveAlert
      tags: [Anomalies]
      summary: Resolve an anomaly alert
      description: |
        Marks an anomaly alert as resolved. Optionally include a resolution note.
      security:
        - bearerAuth: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
          description: Alert ID to resolve
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Optional resolution note
      responses:
        "200":
          description: Alert resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  alertId:
                    type: string
                  ruleId:
                    type: string
                    nullable: true
                  ruleName:
                    type: string
                  severity:
                    type: string
                  status:
                    type: string
                    example: resolved
                  agentId:
                    type: string
                    nullable: true
                  detectedAt:
                    type: string
                    format: date-time
                  description:
                    type: string
                  context:
                    type: object
                  acknowledgedAt:
                    type: string
                    format: date-time
                    nullable: true
                  resolvedAt:
                    type: string
                    format: date-time
        "404":
          description: Alert not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Anomaly Metrics ───────────────────────────────────────────────────────────

  /v1/anomaly/metrics:
    get:
      operationId: getAnomalyMetrics
      tags: [Anomalies]
      summary: Get anomaly metrics
      description: |
        Returns aggregated anomaly metrics broken down by status and severity
        within a configurable time window.
      security:
        - bearerAuth: []
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: ["1h", "6h", "24h"]
            default: "24h"
          description: Time window for metrics aggregation
        - name: agentId
          in: query
          required: false
          schema:
            type: string
          description: Filter metrics by agent ID
      responses:
        "200":
          description: Anomaly metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  window:
                    type: string
                  total:
                    type: integer
                  byStatus:
                    type: object
                    properties:
                      open:
                        type: integer
                      acknowledged:
                        type: integer
                      resolved:
                        type: integer
                  bySeverity:
                    type: object
                    properties:
                      critical:
                        type: integer
                      high:
                        type: integer
                      medium:
                        type: integer
                      low:
                        type: integer

  # ─── Anomaly Rules ─────────────────────────────────────────────────────────────

  /v1/anomaly/rules:
    get:
      operationId: listAnomalyRules
      tags: [Anomalies]
      summary: List detection rules
      description: |
        Returns all built-in and custom anomaly detection rules for the authenticated developer.
        Built-in rules (AD-001 through AD-010) are always included and cannot be deleted.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of detection rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Internal ID (custom rules only)
                        ruleId:
                          type: string
                          description: Rule identifier (e.g. AD-001)
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        condition:
                          type: object
                          description: Rule condition (custom rules only)
                        severity:
                          type: string
                          enum: [critical, high, medium, low]
                        alertChannels:
                          type: array
                          items:
                            type: string
                          description: Channel IDs to notify (custom rules only)
                        enabled:
                          type: boolean
                        builtIn:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                          description: Creation timestamp (custom rules only)

    post:
      operationId: createAnomalyRule
      tags: [Anomalies]
      summary: Create a custom detection rule
      description: |
        Creates a custom anomaly detection rule with a condition object and optional alert channels.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleId:
                  type: string
                  description: Unique rule identifier (e.g. CUSTOM-001)
                name:
                  type: string
                  description: Human-readable rule name
                description:
                  type: string
                  description: Optional description of what the rule detects
                condition:
                  type: object
                  description: Rule condition definition
                severity:
                  type: string
                  enum: [critical, high, medium, low]
                  default: medium
                  description: Alert severity when the rule triggers
                alertChannels:
                  type: array
                  items:
                    type: string
                  description: Notification channel IDs to alert
              required: [ruleId, name, condition]
      responses:
        "201":
          description: Custom rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  ruleId:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                    nullable: true
                  condition:
                    type: object
                  severity:
                    type: string
                  alertChannels:
                    type: array
                    items:
                      type: string
                  enabled:
                    type: boolean
        "400":
          description: Missing required fields or invalid severity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/anomaly/rules/{ruleId}:
    delete:
      operationId: deleteAnomalyRule
      tags: [Anomalies]
      summary: Delete a custom detection rule
      description: |
        Deletes a custom anomaly detection rule. Built-in rules cannot be deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
          description: Internal ID of the custom rule to delete
      responses:
        "204":
          description: Rule deleted
        "404":
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ─── Anomaly Channels ─────────────────────────────────────────────────────────

  /v1/anomaly/channels:
    get:
      operationId: listAnomalyChannels
      tags: [Anomalies]
      summary: List notification channels
      description: |
        Returns all notification channels configured for the authenticated developer.
        Channels receive alerts when detection rules fire.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of notification channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum: [slack, webhook, email]
                        name:
                          type: string
                        config:
                          type: object
                          description: Channel-specific configuration (e.g. URL, email)
                        severities:
                          type: array
                          items:
                            type: string
                          description: Severity levels this channel receives
                        enabled:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time

    post:
      operationId: createAnomalyChannel
      tags: [Anomalies]
      summary: Create a notification channel
      description: |
        Creates a notification channel for anomaly alerts. Supported types: slack, webhook, email.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [slack, webhook, email]
                  description: Channel type
                name:
                  type: string
                  description: Human-readable channel name
                config:
                  type: object
                  description: |
                    Channel-specific configuration.
                    - **slack**: `{ "webhookUrl": "https://hooks.slack.com/..." }`
                    - **webhook**: `{ "url": "https://example.com/hook", "secret": "..." }`
                    - **email**: `{ "to": "alerts@example.com" }`
                severities:
                  type: array
                  items:
                    type: string
                    enum: [critical, high, medium, low]
                  default: [critical, high]
                  description: Severity levels to receive (defaults to critical and high)
              required: [type, name, config]
      responses:
        "201":
          description: Notification channel created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  name:
                    type: string
                  config:
                    type: object
                  severities:
                    type: array
                    items:
                      type: string
                  enabled:
                    type: boolean
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

