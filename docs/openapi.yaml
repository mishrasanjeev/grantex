      operationId: getConsentDetails
      tags: [Consent]
      summary: Get consent request details
      security: []
      responses:
        "200":
          description: Consent request details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  agentName:
                    type: string
                  agentDid:
                    type: string
                  agentDescription:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  scopeDescriptions:
                    type: array
                    items:
                      type: string
                  expiresAt:
                    type: string
                    format: date-time
                  status:
                    type: string
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Request expired or already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/consent/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Authorization request ID
    post:
      operationId: approveConsent
      tags: [Consent]
      summary: Approve consent (end-user action)
      security: []
      responses:
        "200":
          description: Consent approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  redirectUri:
                    type: string
                  state:
                    type: string
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Request expired or already processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/consent/{id}/deny:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Authorization request ID
    post:
      operationId: denyConsent
      tags: [Consent]
      summary: Deny consent (end-user action)
      security: []
      responses:
        "200":
          description: Consent denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectUri:
                    type: string
                  state:
                    type: string
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Tokens ───────────────────────────────────────────────────────────
  /v1/token:
    post:
      operationId: exchangeToken
      tags: [Tokens]
      summary: Exchange authorization code for grant token
      description: |
        Exchanges an authorization code for a signed grant token (RS256 JWT).
        If the authorization used PKCE (S256), a `codeVerifier` is required.
        Fires webhook events for `grant.created` and `token.issued`.

        **Rate limit: 20 requests/minute.**
      x-rateLimit:
        limit: 20
        period: minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Authorization code from consent approval
                agentId:
                  type: string
                codeVerifier:
                  type: string
                  description: PKCE code verifier (required if code_challenge was used)
                credentialFormat:
                  type: string
                  enum: [vc-jwt]
                  description: |
                    When set to "vc-jwt", a W3C Verifiable Credential (VC-JWT) is issued alongside the
                    standard grant token. The VC is a portable, tamper-proof proof of authorization.
              required: [code, agentId]
      responses:
        "201":
          description: Grant token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  grantToken:
                    type: string
                    description: Signed RS256 JWT
                  expiresAt:
                    type: string
                    format: date-time
                  scopes:
                    type: array
                    items:
                      type: string
                  refreshToken:
                    type: string
                  grantId:
                    type: string
                  verifiableCredential:
                    type: string
                    description: W3C VC-JWT (present when credentialFormat is "vc-jwt")
        "400":
          description: Invalid code, not approved, expired, or PKCE mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/token/refresh:
    post:
      operationId: refreshToken
      tags: [Tokens]
      summary: Refresh a grant token
      description: |
        Exchanges a refresh token for a new grant token and rotated refresh token while the underlying grant remains active.
        Refresh does not extend the grant expiration; after the grant expires, the caller must re-authorize.
        The old refresh token is marked as used after rotation (single-use rotation per SPEC §7.4).
        If the response is lost after the rotation commits, the immediately previous refresh token may be
        retried for a five-minute (300-second) replay-recovery window; the server returns the already-rotated refresh token and
        does not rotate the chain again. After that window, or once the rotated child token has been used,
        the old refresh token is rejected. Returns the same grantId and expiresAt with a new JWT and refresh token.

        **Rate limit: 20 requests/minute.**
      x-rateLimit:
        limit: 20
        period: minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh token from a previous token exchange or refresh
                agentId:
                  type: string
                  description: Agent ID that the refresh token was issued to
              required: [refreshToken, agentId]
      responses:
        "201":
          description: New grant token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  grantToken:
                    type: string
                    description: New signed RS256 JWT
                  expiresAt:
                    type: string
                    format: date-time
                  scopes:
                    type: array
                    items:
                      type: string
                  refreshToken:
                    type: string
                    description: New rotated refresh token (single-use)
                  grantId:
                    type: string
                    description: Same grant ID as original token
        "400":
          description: Invalid, expired, used, or revoked refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/tokens/verify:
    post:
      operationId: verifyToken
      tags: [Tokens]
      summary: Verify a grant token online
      description: Server-side token verification with current revocation state. For local signature-and-claim verification, retrieve keys from the JWKS endpoint; standalone SDK helpers currently fetch JWKS per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      valid:
                        type: boolean
                        const: true
                      grantId:
                        type: string
                      scopes:
                        type: array
                        items:
                          type: string
                      principal:
                        type: string
                      agent:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                  - type: object
                    properties:
                      valid:
                        type: boolean
                        const: false
        "400":
          description: Token missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/tokens/revoke:
    post:
      operationId: revokeToken
      tags: [Tokens]
      summary: Revoke a grant token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jti:
                  type: string
                  description: Token ID (jti claim from the JWT)
              required: [jti]
      responses:
        "204":
          description: Token revoked
        "404":
          description: Token not found or already revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Grants ───────────────────────────────────────────────────────────
  /v1/grants:
    get:
      operationId: listGrants
      tags: [Grants]
      summary: List grants
      parameters:
        - name: agentId
          in: query
          schema:
            type: string
        - name: principalId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, revoked, expired]
      responses:
        "200":
          description: Grant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      $ref: "#/components/schemas/Grant"

  /v1/grants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Grant ID
    get:
      operationId: getGrant
      tags: [Grants]
      summary: Get grant by ID
      responses:
        "200":
          description: Grant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Grant"
        "404":
          description: Grant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: revokeGrant
      tags: [Grants]
      summary: Revoke a grant
      description: Revokes the grant and cascade-revokes all descendant delegated grants.
      responses:
        "204":
          description: Grant revoked
        "404":
          description: Grant not found or already revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/grants/verify:
    post:
      operationId: verifyGrant
      tags: [Grants]
      summary: Verify a grant token's revocation status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required: [token]
      responses:
        "200":
          description: Grant verification result
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      active:
                        type: boolean
                        const: true
                      claims:
                        type: object
                  - type: object
                    properties:
                      active:
                        type: boolean
                        const: false
                      reason:
                        type: string
                        enum: [revoked, not_found, expired]
        "400":
          description: Token missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/grants/delegate:
    post:
      operationId: delegateGrant
      tags: [Grants]
      summary: Delegate a grant to a sub-agent
      description: |
        Creates a delegated grant for a sub-agent with narrowed scopes.
        Sub-agent scopes must be a subset of the parent grant's scopes.
        Sub-agent token expiry is capped at the parent token's expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentGrantToken:
                  type: string
                  description: Parent agent's grant token (JWT)
                subAgentId:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                  description: Must be a subset of the parent grant's scopes
                expiresIn:
                  type: string
                  default: "1h"
              required: [parentGrantToken, subAgentId, scopes]
      responses:
        "201":
          description: Delegated grant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  grantToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
                  scopes:
                    type: array
                    items:
                      type: string
                  grantId:
                    type: string
        "400":
          description: Invalid token or scope escalation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Sub-agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Audit ────────────────────────────────────────────────────────────
  /v1/audit/log:
    post:
      operationId: createAuditEntry
      tags: [Audit]
      summary: Log an audit entry
      description: Appends an entry to the immutable, hash-chained audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                agentDid:
                  type: string
                grantId:
                  type: string
                principalId:
                  type: string
                action:
                  type: string
                  description: "Action identifier (e.g. 'payment.initiated', 'file.read')"
                metadata:
                  type: object
                status:
                  type: string
                  enum: [success, failure, blocked]
                  default: success
              required: [agentId, agentDid, grantId, principalId, action]
      responses:
        "201":
          description: Audit entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Plan audit entry limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/audit/entries:
    get:
      operationId: listAuditEntries
      tags: [Audit]
      summary: List audit entries
      parameters:
        - name: agentId
          in: query
          schema:
            type: string
        - name: grantId
          in: query
          schema:
            type: string
        - name: principalId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"

  /v1/audit/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Audit entry ID
    get:
      operationId: getAuditEntry
      tags: [Audit]
      summary: Get audit entry by ID
      responses:
        "200":
          description: Audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Policies ─────────────────────────────────────────────────────────
  /v1/policies:
    post:
      operationId: createPolicy
      tags: [Policies]
      summary: Create an access policy
      description: Policies automate grant approval or denial based on agent, principal, scopes, and time-of-day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                effect:
                  type: string
                  enum: [allow, deny]
                priority:
                  type: integer
                  default: 0
                  description: Higher priority policies are evaluated first
                agentId:
                  type: string
                principalId:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                timeOfDayStart:
                  type: string
                  description: "HH:mm format"
                timeOfDayEnd:
                  type: string
                  description: "HH:mm format"
              required: [name, effect]
      responses:
        "201":
          description: Policy created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: Invalid effect value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Plan policy limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listPolicies
      tags: [Policies]
      summary: List access policies
      description: Returns policies ordered by priority (descending), then creation date (ascending).
      responses:
        "200":
          description: Policy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Policy"
                  total:
                    type: integer

  /v1/policies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Policy ID
    get:
      operationId: getPolicy
      tags: [Policies]
      summary: Get policy by ID
      responses:
        "200":
          description: Policy details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updatePolicy
      tags: [Policies]
      summary: Update a policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                effect:
                  type: string
                  enum: [allow, deny]
                priority:
                  type: integer
                agentId:
                  type: string
                principalId:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                timeOfDayStart:
                  type: string
                timeOfDayEnd:
                  type: string
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "400":
          description: Invalid effect value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePolicy
      tags: [Policies]
      summary: Delete a policy
      responses:
        "204":
          description: Policy deleted
        "404":
          description: Policy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Webhooks ─────────────────────────────────────────────────────────
  /v1/event-sources:
    post:
      operationId: createEventSource
      tags: [Event Bridge]
      summary: Register an event source
      description: |
        Register an SSF/CAEP transmitter (`kind: ssf`) that pushes Security Event Tokens, or a
        generic signed webhook sender (`kind: webhook`). A webhook source's `secret` is returned
        once and stored encrypted. Requires `EVENT_BRIDGE_ENABLED=true` (403 `FEATURE_DISABLED`
        otherwise). See docs/concepts/event-bridge-and-revocation.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, name]
              properties:
                kind: { type: string, enum: [ssf, webhook] }
                name: { type: string, maxLength: 128 }
                issuer: { type: string, maxLength: 512, description: "ssf: expected iss" }
                audience: { type: string, maxLength: 512, description: "ssf: expected aud (default: the ingest URL)" }
                jwksUri: { type: string, format: uri, description: "ssf: transmitter JWK Set URL" }
                jwks: { type: object, description: "ssf: inline public JWK Set" }
                algorithms: { type: array, items: { type: string, enum: [RS256, PS256, ES256, ES384, EdDSA] } }
                maxAgeSeconds: { type: integer, minimum: 30, maximum: 86400, default: 300 }
                toleranceSeconds: { type: integer, minimum: 30, maximum: 3600, default: 300, description: "webhook: replay window" }
      responses:
        "201":
          description: Source registered (webhook sources include `secret`, shown once)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSource"
        "403":
          description: Event bridge not enabled
        "422":
          description: Validation failed
        "503":
          description: VAULT_ENCRYPTION_KEY is not configured (webhook sources)
    get:
      operationId: listEventSources
      tags: [Event Bridge]
      summary: List event sources
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSource"
  /v1/event-sources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEventSource
      tags: [Event Bridge]
      summary: Get an event source
      responses:
        "200":
          description: Source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSource"
        "404":
          description: Not found (including sources of another developer)
    patch:
      operationId: updateEventSource
      tags: [Event Bridge]
      summary: Update or disable an event source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string, enum: [active, disabled] }
                issuer: { type: string }
                audience: { type: string }
                jwksUri: { type: [string, "null"] }
                jwks: { type: [object, "null"] }
                algorithms: { type: array, items: { type: string } }
                maxAgeSeconds: { type: integer }
                toleranceSeconds: { type: integer }
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSource"
        "404":
          description: Not found
        "422":
          description: Validation failed
  /v1/event-sources/{id}/rotate-secret:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: rotateEventSourceSecret
      tags: [Event Bridge]
      summary: Rotate a webhook source secret
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                previousSecretTtlSeconds:
                  type: integer
                  minimum: 0
                  maximum: 604800
                  default: 86400
                  description: How long the previous secret keeps verifying; 0 stops it immediately
      responses:
        "200":
          description: Rotated; the new `secret` is shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSource"
        "404":
          description: Not found
  /v1/event-bridge/ssf/{sourceId}:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: ingestSecurityEventToken
      tags: [Event Bridge]
      summary: Receive a Security Event Token (RFC 8935 push)
      description: |
        Authenticated by the SET signature (no API key). `typ` must be `secevent+jwt`; `iss`, `aud`,
        `iat`, `jti` and `events` are verified against the registration. Unverifiable tokens are
        refused with 401 and never acted on; a repeated `jti` is not acted on again.
      security: []
      requestBody:
        required: true
        content:
          application/secevent+jwt:
            schema:
              type: string
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBridgeAccepted"
        "401":
          description: Unverifiable delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBridgeRefused"
        "404":
          description: Event bridge not enabled
        "415":
          description: Content-Type is not application/secevent+jwt
  /v1/event-bridge/webhooks/{sourceId}:
    parameters:
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: ingestSignedWebhookEvent
      tags: [Event Bridge]
      summary: Receive a generic signed webhook event
      description: |
        Authenticated by `X-Grantex-Signature: sha256=HEX(HMAC-SHA256(secret, "<timestamp>.<raw body>"))`
        with `X-Grantex-Timestamp` inside the source replay window (no API key).
      security: []
      parameters:
        - { name: X-Grantex-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-Grantex-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type]
              properties:
                id: { type: string, maxLength: 256 }
                type: { type: string, maxLength: 512 }
                occurred_at: { type: string, format: date-time }
                subject: { type: object }
                data: { type: object }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBridgeAccepted"
        "401":
          description: Unverifiable delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventBridgeRefused"
        "404":
          description: Event bridge not enabled
        "415":
          description: Content-Type is not application/json
  /v1/event-mapping-rules:
    post:
      operationId: createEventMappingRule
      tags: [Event Bridge]
      summary: Declare what a provider event does to grants
      description: |
        Map an event type and a subject matcher to one action — `suspend`, `revoke` or
        `re_evaluate`. Rules resolve only this developer's grants. Requires
        `EVENT_BRIDGE_ENABLED=true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventMappingRuleInput"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMappingRule"
        "403":
          description: Event bridge not enabled
        "422":
          description: Validation failed (including a source of another developer)
    get:
      operationId: listEventMappingRules
      tags: [Event Bridge]
      summary: List mapping rules
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventMappingRule"
  /v1/event-mapping-rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getEventMappingRule
      tags: [Event Bridge]
      summary: Get a mapping rule
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMappingRule"
        "404":
          description: Not found (including rules of another developer)
    patch:
      operationId: updateEventMappingRule
      tags: [Event Bridge]
      summary: Update, disable or switch a rule to observe mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventMappingRuleInput"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventMappingRule"
        "404":
          description: Not found
        "422":
          description: Validation failed
  /v1/grants/{id}/subject-refs:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: putGrantSubjectRefs
      tags: [Event Bridge]
      summary: Bind subject identifiers to a grant
      description: |
        Replace the identifiers (business reference, case id, order id — the developer's own
        vocabulary) that `subject_ref` mapping rules resolve to this grant. Bindings on a parent
        grant are enough: actions cascade to everything delegated beneath it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refs]
              properties:
                refs:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [kind, value]
                    properties:
                      kind: { type: string, maxLength: 64 }
                      value: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Bindings replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantSubjectRefs"
        "404":
          description: No such grant for this developer
        "422":
          description: Validation failed
    get:
      operationId: getGrantSubjectRefs
      tags: [Event Bridge]
      summary: List a grant's subject bindings
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrantSubjectRefs"
  /v1/grants/{id}/resume:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, description: "Root of the suspension" } }
    post:
      operationId: resumeSuspendedGrant
      tags: [Event Bridge]
      summary: Undo a suspension
      description: |
        Restore exactly the grants one suspension suspended. Available whether or not the event
        bridge is enabled, so a suspension can always be undone.
      responses:
        "200":
          description: Resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  grantId: { type: string }
                  resumedGrantIds: { type: array, items: { type: string } }
        "404":
          description: Not the root of a suspension, or not this developer's grant
        "409":
          description: A grant above this one is revoked or suspended
  /v1/webhooks:
    post:
      operationId: createWebhook
      tags: [Webhooks]
      summary: Register a webhook
      description: |
        Register a URL to receive webhook notifications for grant and token events.
        Valid events: `grant.created`, `grant.revoked`, `token.issued`.
        Webhook payloads are signed with the returned `secret` (HMAC-SHA256).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                    enum: [grant.created, grant.revoked, token.issued]
                  minItems: 1
              required: [url, events]
      responses:
        "201":
          description: Webhook registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"
        "400":
          description: Invalid events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Plan webhook limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listWebhooks
      tags: [Webhooks]
      summary: List webhooks
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Webhook"

  /v1/webhooks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Webhook ID
    delete:
      operationId: deleteWebhook
      tags: [Webhooks]
      summary: Delete a webhook
      responses:
        "204":
          description: Webhook deleted
        "404":
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Billing ──────────────────────────────────────────────────────────
  /v1/billing/subscription:
    get:
      operationId: getSubscription
      tags: [Billing]
      summary: Get current subscription
      responses:
        "200":
          description: Subscription details
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: string
                    enum: [free, pro, enterprise]
                  status:
                    type: string
                  currentPeriodEnd:
                    type: string
                    format: date-time

  /v1/billing/checkout:
    post:
      operationId: createCheckoutSession
