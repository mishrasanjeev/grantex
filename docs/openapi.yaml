            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteAgent
      tags: [Agents]
      summary: Delete an agent
      responses:
        "204":
          description: Agent deleted
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Authorization ────────────────────────────────────────────────────
  /v1/authorize:
    post:
      operationId: createAuthorizationRequest
      tags: [Authorization]
      summary: Create an authorization request
      description: |
        Creates an authorization request and returns a consent URL for the end-user.
        In sandbox mode, returns a `code` directly (no redirect needed).
        If a matching policy auto-approves, returns a `code` with `policyEnforced: true`.

        **Rate limit: 10 requests/minute.**
      x-rateLimit:
        limit: 10
        period: minute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agentId:
                  type: string
                principalId:
                  type: string
                  description: Your application's user identifier
                scopes:
                  type: array
                  items:
                    type: string
                redirectUri:
                  type: string
                  format: uri
                state:
                  type: string
                expiresIn:
                  type: string
                  default: "24h"
                  description: Duration string (e.g. '1h', '24h', '7d')
                audience:
                  type: string
                codeChallenge:
                  type: string
                  description: PKCE code challenge (S256 only)
                codeChallengeMethod:
                  type: string
                  enum: [S256]
                purpose:
                  type: string
                  maxLength: 128
                  description: |
                    Purpose the grant is bound to: one of `aml.cdd.onboarding`, `aml.cdd.ongoing`,
                    `aml.screening`, `procurement.vendor_onboarding`, `payments.payout`, or a private
                    term `x-<org>.<term>`. Requires at least one `tool:<connector>:<permission>` scope.
                    Issued tokens carry it in `authorization_details` entries of type
                    `urn:grantex:tools:v1`, one per connector. Rejected with `INVALID_PURPOSE`.
                  example: aml.cdd.onboarding
              required: [agentId, principalId, scopes]
      responses:
        "201":
          description: Authorization request created
          content:
            application/json:
              schema:
                type: object
                properties:
                  authRequestId:
                    type: string
                  consentUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
                  sandbox:
                    type: boolean
                  code:
                    type: string
                    description: Present in sandbox mode or when policy auto-approves
                  policyEnforced:
                    type: boolean
                  effect:
                    type: string
                    enum: [allow]
                  purpose:
                    type: string
                    description: Present when the request carries a purpose
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Plan grant limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Policy denied the authorization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/authorize/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Authorization request ID
    post:
      operationId: approveAuthorizationRequest
      tags: [Authorization]
      summary: Approve an authorization request
      description: Programmatic approval (for testing). In production, use the consent UI.
      responses:
        "200":
          description: Request approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
                  code:
                    type: string
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/authorize/{id}/deny:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Authorization request ID
    post:
      operationId: denyAuthorizationRequest
      tags: [Authorization]
      summary: Deny an authorization request
      responses:
        "200":
          description: Request denied
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  status:
                    type: string
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Consent ──────────────────────────────────────────────────────────
  /consent:
    get:
      operationId: getConsentPage
      tags: [Consent]
      summary: Consent UI page
      description: HTML consent page for end-user approval.
