<svg viewBox="0 0 420 678" xmlns="http://www.w3.org/2000/svg" width="420" height="678" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="fig-flow-svg-title">From merchant facts to buyer agents</title><desc id="fig-flow-svg-desc">Seven steps: the merchant states facts once, Grantex signs them, AgenticOrg verifies and caches them, the arbiter decides allow or refuse, the ledger records it, adapters render UCP, ACP, AP2, MCP and A2A, and buyer agents get the same answer.</desc><defs><marker id="fig-flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(107, 125, 149)"></path></marker></defs><line x1="26" y1="30" x2="26" y2="638" fill="none" stroke="rgb(107, 125, 149)" stroke-width="1.75" stroke-dasharray="3, 5" stroke-linecap="butt" font-size="16" font-weight="400"></line><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="51" r="16" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></circle><text x="26" y="57" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">1</text><rect x="56" y="12" width="352" height="78" rx="10" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></rect><text x="70" y="34" text-anchor="start" fill="rgb(179, 192, 209)" font-size="13" font-weight="650" letter-spacing="0.26">Merchant</text><text x="70" y="57" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">States its facts once</text><text x="70" y="78" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Catalog, price, stock, policy, limits</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="147" r="16" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5"></circle><text x="26" y="153" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">2</text><rect x="56" y="108" width="352" height="78" rx="10" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5"></rect><text x="70" y="130" text-anchor="start" fill="rgb(169, 200, 255)" font-size="13" font-weight="650" letter-spacing="0.26">Grantex</text><text x="70" y="153" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Signs each fact</text><text x="70" y="174" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">ES256 signature, expiry, revoke slot</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="243" r="16" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></circle><text x="26" y="249" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">3</text><rect x="56" y="204" width="352" height="78" rx="10" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></rect><text x="70" y="226" text-anchor="start" fill="rgb(143, 224, 189)" font-size="13" font-weight="650" letter-spacing="0.26">AgenticOrg</text><text x="70" y="249" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Verifies and caches</text><text x="70" y="270" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Refuses unsigned, changed or revoked</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="339" r="16" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></circle><text x="26" y="345" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">4</text><rect x="56" y="300" width="352" height="78" rx="10" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></rect><text x="70" y="322" text-anchor="start" fill="rgb(143, 224, 189)" font-size="13" font-weight="650" letter-spacing="0.26">AgenticOrg arbiter</text><text x="70" y="345" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Decides allow or refuse</text><text x="70" y="366" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Fixed rules; nobody waits for a person</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="435" r="16" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></circle><text x="26" y="441" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">5</text><rect x="56" y="396" width="352" height="78" rx="10" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></rect><text x="70" y="418" text-anchor="start" fill="rgb(143, 224, 189)" font-size="13" font-weight="650" letter-spacing="0.26">AgenticOrg ledger</text><text x="70" y="441" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Records every decision</text><text x="70" y="462" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Hash-chained and checkable offline</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="531" r="16" fill="rgb(15, 49, 65)" stroke="rgb(143, 214, 242)" stroke-width="2"></circle><text x="26" y="537" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">6</text><rect x="56" y="492" width="352" height="78" rx="10" fill="rgb(15, 49, 65)" stroke="rgb(143, 214, 242)" stroke-width="2"></rect><text x="70" y="514" text-anchor="start" fill="rgb(143, 214, 242)" font-size="13" font-weight="650" letter-spacing="0.26">Adapters</text><text x="70" y="537" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Speak each protocol</text><g><rect x="70" y="544" width="56" height="20" rx="10" fill="rgb(27, 38, 56)" stroke="rgb(93, 112, 138)" stroke-width="1.5"></rect><text x="98" y="558.5" text-anchor="middle" fill="rgb(179, 192, 209)" font-size="14">UCP</text></g><g><rect x="134" y="544" width="56" height="20" rx="10" fill="rgb(27, 38, 56)" stroke="rgb(93, 112, 138)" stroke-width="1.5"></rect><text x="162" y="558.5" text-anchor="middle" fill="rgb(179, 192, 209)" font-size="14">ACP</text></g><g><rect x="198" y="544" width="56" height="20" rx="10" fill="rgb(27, 38, 56)" stroke="rgb(93, 112, 138)" stroke-width="1.5"></rect><text x="226" y="558.5" text-anchor="middle" fill="rgb(179, 192, 209)" font-size="14">AP2</text></g><g><rect x="262" y="544" width="56" height="20" rx="10" fill="rgb(27, 38, 56)" stroke="rgb(93, 112, 138)" stroke-width="1.5"></rect><text x="290" y="558.5" text-anchor="middle" fill="rgb(179, 192, 209)" font-size="14">MCP</text></g><g><rect x="326" y="544" width="56" height="20" rx="10" fill="rgb(27, 38, 56)" stroke="rgb(93, 112, 138)" stroke-width="1.5"></rect><text x="354" y="558.5" text-anchor="middle" fill="rgb(179, 192, 209)" font-size="14">A2A</text></g></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="627" r="16" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></circle><text x="26" y="633" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">7</text><rect x="56" y="588" width="352" height="78" rx="10" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></rect><text x="70" y="610" text-anchor="start" fill="rgb(179, 192, 209)" font-size="13" font-weight="650" letter-spacing="0.26">Buyer agents</text><text x="70" y="633" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Get the same answer</text><text x="70" y="654" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Same price, same rules, same refusals</text></g></svg>
