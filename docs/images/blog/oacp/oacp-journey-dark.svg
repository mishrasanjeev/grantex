<svg viewBox="0 0 420 678" xmlns="http://www.w3.org/2000/svg" width="420" height="678" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="fig-journey-svg-title">A purchase with mandates</title><desc id="fig-journey-svg-desc">Seven steps: Grantex issues an Intent mandate, a Cart mandate signed with a passkey when the buyer is present, and a Payment mandate. The buyer's bank adds AFA when RBI rules require it. The arbiter applies eight rules, the payment provider runs the payment once on allow, and the ledger records everything.</desc><defs><marker id="fig-journey-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(107, 125, 149)"></path></marker></defs><line x1="26" y1="30" x2="26" y2="638" fill="none" stroke="rgb(107, 125, 149)" stroke-width="1.75" stroke-dasharray="3, 5" stroke-linecap="butt" font-size="16" font-weight="400"></line><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="51" r="16" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5"></circle><text x="26" y="57" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">1</text><rect x="56" y="12" width="352" height="78" rx="10" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5"></rect><text x="70" y="34" text-anchor="start" fill="rgb(169, 200, 255)" font-size="13" font-weight="650" letter-spacing="0.26">Grantex · Intent mandate</text><text x="70" y="57" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">What the buyer allowed</text><text x="70" y="78" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Example: up to ₹2,000 at one shop</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="147" r="16" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5"></circle><text x="26" y="153" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">2</text><rect x="56" y="108" width="352" height="78" rx="10" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5"></rect><text x="70" y="130" text-anchor="start" fill="rgb(169, 200, 255)" font-size="13" font-weight="650" letter-spacing="0.26">Grantex · Cart mandate</text><text x="70" y="153" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">The exact cart, by hash</text><text x="70" y="174" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Buyer present? A passkey signs it</text><g><rect x="312" y="117" width="84" height="22" rx="11" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></rect><text x="354" y="132.5" text-anchor="middle" fill="rgb(143, 224, 189)" font-size="14">passkey</text></g></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="243" r="16" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5"></circle><text x="26" y="249" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">3</text><rect x="56" y="204" width="352" height="78" rx="10" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5"></rect><text x="70" y="226" text-anchor="start" fill="rgb(169, 200, 255)" font-size="13" font-weight="650" letter-spacing="0.26">Grantex · Payment mandate</text><text x="70" y="249" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Amount, rail, token reference</text><text x="70" y="270" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Plural, UPI AutoPay or card token</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="339" r="16" fill="rgb(58, 42, 12)" stroke="rgb(246, 207, 125)" stroke-width="1.5"></circle><text x="26" y="345" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">4</text><rect x="56" y="300" width="352" height="78" rx="10" fill="rgb(58, 42, 12)" stroke="rgb(246, 207, 125)" stroke-width="1.5"></rect><text x="70" y="322" text-anchor="start" fill="rgb(246, 207, 125)" font-size="13" font-weight="650" letter-spacing="0.26">Buyer's bank · AFA</text><text x="70" y="345" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Extra factor, when RBI needs it</text><text x="70" y="366" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">AutoPay set-up, or above a limit</text><g><rect x="312" y="309" width="84" height="22" rx="11" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></rect><text x="354" y="324.5" text-anchor="middle" fill="rgb(143, 224, 189)" font-size="14">India</text></g></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="435" r="16" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></circle><text x="26" y="441" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">5</text><rect x="56" y="396" width="352" height="78" rx="10" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></rect><text x="70" y="418" text-anchor="start" fill="rgb(143, 224, 189)" font-size="13" font-weight="650" letter-spacing="0.26">AgenticOrg arbiter</text><text x="70" y="441" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Eight rules: allow or refuse</text><text x="70" y="462" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">First failing rule is the reason</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="531" r="16" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></circle><text x="26" y="537" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">6</text><rect x="56" y="492" width="352" height="78" rx="10" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></rect><text x="70" y="514" text-anchor="start" fill="rgb(179, 192, 209)" font-size="13" font-weight="650" letter-spacing="0.26">Payment provider</text><text x="70" y="537" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Runs once, only on allow</text><text x="70" y="558" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Behind a switch that is off by default</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><circle cx="26" cy="627" r="16" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></circle><text x="26" y="633" text-anchor="middle" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">7</text><rect x="56" y="588" width="352" height="78" rx="10" fill="rgb(18, 50, 42)" stroke="rgb(143, 224, 189)" stroke-width="1.5"></rect><text x="70" y="610" text-anchor="start" fill="rgb(143, 224, 189)" font-size="13" font-weight="650" letter-spacing="0.26">AgenticOrg ledger</text><text x="70" y="633" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">One record of it all</text><text x="70" y="654" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Mandate hashes, decision, payment</text></g></svg>
