<svg viewBox="0 0 420 486" xmlns="http://www.w3.org/2000/svg" width="420" height="486" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title id="fig-revoke-svg-title">What happens when something is revoked</title><desc id="fig-revoke-svg-desc">The merchant or operator revokes one fact. Grantex sets its status list slot to invalid and signs a revocation record. Verifiers check the list before trusting a fact. AgenticOrg refuses the cached fact, the UCP profile stops offering it, the arbiter refuses new purchases, and revoking a mandate revokes the mandates built on it. If the list cannot be reached, everything refuses.</desc><defs><marker id="fig-revoke-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="rgb(107, 125, 149)"></path></marker></defs><rect x="20" y="12" width="380" height="64" rx="10" fill="rgb(61, 26, 24)" stroke="rgb(255, 180, 168)" stroke-width="1.5" stroke-linecap="butt" font-size="16" font-weight="400"></rect><text x="36" y="36" text-anchor="start" fill="rgb(255, 180, 168)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="13" font-weight="650" letter-spacing="0.26">Merchant or operator</text><text x="36" y="60" text-anchor="start" fill="rgb(232, 238, 247)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="17" font-weight="650">Revokes one fact, once</text><line x1="210" y1="76" x2="210" y2="98" marker-end="url(#fig-revoke-arrow)" fill="none" stroke="rgb(107, 125, 149)" stroke-width="1.75" stroke-linecap="butt" font-size="16" font-weight="400"></line><rect x="20" y="100" width="380" height="72" rx="10" fill="rgb(23, 42, 73)" stroke="rgb(169, 200, 255)" stroke-width="1.5" stroke-linecap="butt" font-size="16" font-weight="400"></rect><text x="36" y="124" text-anchor="start" fill="rgb(169, 200, 255)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="13" font-weight="650" letter-spacing="0.26">Grantex</text><text x="36" y="146" text-anchor="start" fill="rgb(232, 238, 247)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="17" font-weight="650">Status list slot set to INVALID</text><text x="36" y="164" text-anchor="start" fill="rgb(179, 192, 209)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="14" font-weight="400">plus a signed revocation record</text><line x1="210" y1="172" x2="210" y2="190" fill="none" stroke="rgb(107, 125, 149)" stroke-width="1.75" stroke-linecap="butt" font-size="16" font-weight="400"></line><text x="210" y="208" text-anchor="middle" fill="rgb(179, 192, 209)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="14" font-weight="400">Verifiers check the list before trusting a fact</text><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><rect x="20" y="222" width="184" height="92" rx="10" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></rect><circle cx="44" cy="250" r="11" fill="rgb(61, 26, 24)" stroke="rgb(255, 180, 168)" stroke-width="1.5"></circle><path d="M 39 245 L 49 255 M 49 245 L 39 255" stroke="rgb(255, 180, 168)" stroke-width="2.2" stroke-linecap="round"></path><text x="64" y="256" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">AgenticOrg</text><text x="36" y="284" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Refuses with</text><text x="36" y="302" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">artifact_revoked</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><rect x="216" y="222" width="184" height="92" rx="10" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></rect><circle cx="240" cy="250" r="11" fill="rgb(61, 26, 24)" stroke="rgb(255, 180, 168)" stroke-width="1.5"></circle><path d="M 235 245 L 245 255 M 245 245 L 235 255" stroke="rgb(255, 180, 168)" stroke-width="2.2" stroke-linecap="round"></path><text x="260" y="256" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">UCP profile</text><text x="232" y="284" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Stops offering</text><text x="232" y="302" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">what relied on it</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><rect x="20" y="326" width="184" height="92" rx="10" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></rect><circle cx="44" cy="354" r="11" fill="rgb(61, 26, 24)" stroke="rgb(255, 180, 168)" stroke-width="1.5"></circle><path d="M 39 349 L 49 359 M 49 349 L 39 359" stroke="rgb(255, 180, 168)" stroke-width="2.2" stroke-linecap="round"></path><text x="64" y="360" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Arbiter</text><text x="36" y="388" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Refuses new</text><text x="36" y="406" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">purchases</text></g><g fill="rgb(0, 0, 0)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="16" font-weight="400"><rect x="216" y="326" width="184" height="92" rx="10" fill="rgb(15, 23, 38)" stroke="rgb(58, 74, 98)" stroke-width="1.5"></rect><circle cx="240" cy="354" r="11" fill="rgb(61, 26, 24)" stroke="rgb(255, 180, 168)" stroke-width="1.5"></circle><path d="M 235 349 L 245 359 M 245 349 L 235 359" stroke="rgb(255, 180, 168)" stroke-width="2.2" stroke-linecap="round"></path><text x="260" y="360" text-anchor="start" fill="rgb(232, 238, 247)" font-size="17" font-weight="650">Mandates</text><text x="232" y="388" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">Revoke one and</text><text x="232" y="406" text-anchor="start" fill="rgb(179, 192, 209)" font-size="14">its children go too</text></g><rect x="20" y="430" width="380" height="44" rx="10" fill="rgb(58, 42, 12)" stroke="rgb(246, 207, 125)" stroke-width="1.5" stroke-linecap="butt" font-size="16" font-weight="400"></rect><text x="210" y="457" text-anchor="middle" fill="rgb(246, 207, 125)" stroke="none" stroke-width="1" stroke-linecap="butt" font-size="15" font-weight="500">List unreachable? Everything refuses.</text></svg>
