[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grantex-agent-httpsig"
version = "0.1.0"
description = "RFC 9421 HTTP Message Signatures for agent requests: the Agent-Passport, Agent-Grant and Agent-Trust headers and the agent-payer-auth signing profile"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanjeev Kumar", email = "sanjeev@orchestrum.in" }]
maintainers = [{ name = "Orchestrum Technologies LLP", email = "sanjeev@orchestrum.in" }, { name = "Sanjeev Kumar", email = "mishra.sanjeev@gmail.com" }]
requires-python = ">=3.9"
keywords = ["grantex", "http-message-signatures", "rfc9421", "structured-fields", "rfc9651", "content-digest", "agent-passport", "ai-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    # Not yet published: PyPI refuses uploads that carry this classifier.
    "Private :: Do Not Upload",
]
dependencies = [
    "cryptography>=48.0.1",
]

[project.urls]
Repository = "https://github.com/mishrasanjeev/grantex"
Issues = "https://github.com/mishrasanjeev/grantex/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9; python_version < '3.10'",
    "pytest>=9.0.3; python_version >= '3.10'",
    "mypy>=1.9",
    "ruff>=0.4,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grantex_agent_httpsig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/docs/examples"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
