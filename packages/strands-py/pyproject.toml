[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grantex-strands"
version = "0.2.2"
description = "Scope-checked Strands Agents tools backed by Grantex grant tokens"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanjeev Kumar", email = "sanjeev@orchestrum.in" }]
maintainers = [{ name = "Orchestrum Technologies LLP", email = "sanjeev@orchestrum.in" }, { name = "Sanjeev Kumar", email = "mishra.sanjeev@gmail.com" }]
keywords = ["grantex", "strands", "ai-agents", "authorization", "oauth", "tools", "scope-enforcement", "delegated-auth", "agent-permissions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "grantex>=0.7.2,<1",
    "strands-agents>=0.1",
    # Patched 1.x compatibility line; see GHSA-84m7-p3x7-pcfv.
    "mcp>=1.30.0,<2",
]

[project.urls]
Homepage = "https://grantex.dev"
Documentation = "https://docs.grantex.dev"
Repository = "https://github.com/mishrasanjeev/grantex"
Issues = "https://github.com/mishrasanjeev/grantex/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9; python_version < '3.10'",
    "pytest>=9.0.3; python_version >= '3.10'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grantex_strands"]
