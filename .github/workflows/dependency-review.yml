name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          # Match the existing Python-2.0 policy in audit-python-dependencies.py.
          allow-licenses: >-
            Apache-2.0,
            MIT,
            ISC,
            BSD-2-Clause,
            BSD-3-Clause,
            BlueOak-1.0.0,
            0BSD,
            MPL-2.0,
            Unlicense,
            LicenseRef-scancode-unicode,
            LicenseRef-scancode-google-patent-license-golang,
            LGPL-3.0-or-later,
            AFL-2.1,
            CC0-1.0,
            CC-BY-4.0,
            Python-2.0,
            MIT-0
          # GitHub normalizes json-schema@0.4.0's declared
          # "AFL-2.1 OR BSD-3-Clause" choice as a stricter conjunction that
          # also mentions AFL-3.0. The shipped LICENSE permits BSD-3-Clause;
          # keep this exception exact and documented in THIRD_PARTY_NOTICES.md.
          # Orchestrum's own packages follow: they are licensed by the owner
          # (PolyForm-Noncommercial-1.0.0 from 2026-10-21, Apache-2.0 before),
          # so the third-party allowlist above does not apply to them.
          allow-dependencies-licenses: >-
            pkg:npm/json-schema@0.4.0,
            pkg:npm/%40grantex/a2a,
            pkg:npm/%40grantex/adapters,
            pkg:npm/%40grantex/agent-httpsig,
            pkg:npm/%40grantex/agent-passport,
            pkg:npm/%40grantex/anthropic,
            pkg:npm/%40grantex/autogen,
            pkg:npm/%40grantex/cli,
            pkg:npm/%40grantex/conformance,
            pkg:npm/%40grantex/destinations,
            pkg:npm/%40grantex/dpdp,
            pkg:npm/%40grantex/express,
            pkg:npm/%40grantex/gateway,
            pkg:npm/%40grantex/gemma,
            pkg:npm/%40grantex/langchain,
            pkg:npm/%40grantex/mcp,
            pkg:npm/%40grantex/mcp-auth,
            pkg:npm/%40grantex/mock-issuer,
            pkg:npm/%40grantex/mpp,
            pkg:npm/%40grantex/sdk,
            pkg:npm/%40grantex/strands,
            pkg:npm/%40grantex/vercel-ai,
            pkg:npm/%40grantex/x402,
            pkg:pypi/grantex,
            pkg:pypi/grantex-a2a,
            pkg:pypi/grantex-adk,
            pkg:pypi/grantex-agent-httpsig,
            pkg:pypi/grantex-agent-passport,
            pkg:pypi/grantex-crewai,
            pkg:pypi/grantex-fastapi,
            pkg:pypi/grantex-gemma,
            pkg:pypi/grantex-openai-agents,
            pkg:pypi/grantex-strands,
            pkg:pypi/grantex-verifier,
            pkg:golang/github.com/mishrasanjeev/grantex-go
          comment-summary-in-pr: always
