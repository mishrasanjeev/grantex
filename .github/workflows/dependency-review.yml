name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          allow-licenses: >-
            Apache-2.0,
            MIT,
            ISC,
            BSD-2-Clause,
            BSD-3-Clause,
            BlueOak-1.0.0,
            0BSD,
            MPL-2.0,
            Unlicense,
            LicenseRef-scancode-unicode,
            LicenseRef-scancode-google-patent-license-golang,
            LGPL-3.0-or-later,
            AFL-2.1,
            CC0-1.0,
            CC-BY-4.0,
            MIT-0
          # GitHub normalizes json-schema@0.4.0's declared
          # "AFL-2.1 OR BSD-3-Clause" choice as a stricter conjunction that
          # also mentions AFL-3.0. The shipped LICENSE permits BSD-3-Clause;
          # keep this exception exact and documented in THIRD_PARTY_NOTICES.md.
          allow-dependencies-licenses: pkg:npm/json-schema@0.4.0
          comment-summary-in-pr: always
