name: Production Passkey and Irregularity E2E

on:
  workflow_dispatch:

jobs:
  production-e2e:
    name: Hosted passkey consent and account response policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/auth-service/package-lock.json
            packages/sdk-ts/package-lock.json
      - name: Install TypeScript SDK dependencies
        working-directory: packages/sdk-ts
        run: npm ci
      - name: Install auth-service test dependencies
        working-directory: apps/auth-service
        run: npm ci
      - name: Install Chromium
        working-directory: apps/auth-service
        run: npx playwright install --with-deps chromium
      - name: Exercise hosted enrollment, live consent and both response modes
        working-directory: apps/auth-service
        env:
          E2E_BASE_URL: https://grantex-auth-dd4mtrt2gq-uc.a.run.app
          E2E_PUBLIC_BASE_URL: https://grantex.dev
        run: npm run test:production
