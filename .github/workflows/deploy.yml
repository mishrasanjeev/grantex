# .github/workflows/deploy.yml
# Deploys auth-service to GCP Cloud Run on push to main.
#
# Prerequisites (one-time setup):
#   bash deploy/gcp/setup-wif.sh
#   Add GitHub secrets:
#     GCP_WORKLOAD_IDENTITY_PROVIDER  — WIF provider resource name
#     GCP_SERVICE_ACCOUNT             — grantex-auth-sa@grantex-prod.iam.gserviceaccount.com
#
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'apps/auth-service/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation

env:
  PROJECT_ID: grantex-prod
  REGION: us-central1
  AR_REPO: grantex-images
  CR_SERVICE: grantex-auth
  IMAGE_BASE: us-central1-docker.pkg.dev/grantex-prod/grantex-images/auth-service

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/auth-service
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}:latest
          cache-to: type=inline

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.CR_SERVICE }}
          image: ${{ env.IMAGE_BASE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          # Remove legacy seed keys that may still exist on the Cloud Run
          # service; production configuration rejects them at startup.
          # These are Secret Manager-backed variables on the existing service,
          # so --remove-env-vars alone cannot remove them.
          flags: '--remove-env-vars=SEED_API_KEY,SEED_SANDBOX_KEY --remove-secrets=SEED_API_KEY,SEED_SANDBOX_KEY'

      - name: Print deployed URL
        run: |
          echo "Deployed to: ${{ steps.deploy.outputs.url }}"
          echo "Image: ${{ env.IMAGE_BASE }}:${{ github.sha }}"
