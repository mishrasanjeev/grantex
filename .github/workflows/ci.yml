name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  make:
    name: make check and make test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: grantex_test
          POSTGRES_PASSWORD: grantex_test
          POSTGRES_DB: grantex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantex_test -d grantex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The auth-service audit integration test refuses to skip in CI.
      AUDIT_INTEGRATION_DATABASE_URL: postgres://grantex_test:grantex_test@127.0.0.1:5432/grantex_test
      # The caps meter integration tests (Python and TypeScript SDKs) run
      # against real Redis and Postgres here and refuse to skip.
      GRANTEX_CAPS_REDIS_URL: redis://127.0.0.1:6379/0
      GRANTEX_CAPS_POSTGRES_URL: postgres://grantex_test:grantex_test@127.0.0.1:5432/grantex_test
      GRANTEX_CAPS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: make install
      - run: make check
      - run: make test

  docs-integrity:
    name: Documentation Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/scripts/seo-aeo-release.test.mjs tests/scripts/runtime-image.test.mjs tests/scripts/e2e-workflow.test.mjs tests/scripts/dependency-policy.test.mjs tests/scripts/security-boundaries.test.mjs tests/scripts/licensing.test.mjs tests/scripts/nextjs-starter.test.mjs
      - name: Install URI and HTTP regression dependencies
        run: |
          for directory in apps/auth-service packages/vercel-ai apps/portal; do
            npm ci --prefix "$directory" --ignore-scripts --no-audit --no-fund
          done
      - run: node --test tests/scripts/uri-http-dependencies.test.mjs
      - run: node scripts/check-docs-integrity.mjs

  helm-network-policy:
    name: Restricted Network Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install checksum-verified Helm renderer
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz -o /tmp/helm.tar.gz
          echo '0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  /tmp/helm.tar.gz' | sha256sum --check
          tar -xzf /tmp/helm.tar.gz -C /tmp
          echo '/tmp/linux-amd64' >> "$GITHUB_PATH"
      - run: node --test tests/scripts/helm-network-policy.test.mjs

  commerce-preview-conformance:
    name: Commerce Preview Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Preview conformance gate (local only)
        run: node scripts/commerce-c6oe-preview-conformance-gate.mjs --mode pr

  auth-service:
    name: Auth Service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: grantex_test
          POSTGRES_PASSWORD: grantex_test
          POSTGRES_DB: grantex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantex_test -d grantex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUDIT_INTEGRATION_DATABASE_URL: postgres://grantex_test:grantex_test@127.0.0.1:5432/grantex_test
    defaults:
      run:
        working-directory: apps/auth-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/auth-service/package-lock.json
      - run: npm ci
      - name: Install TypeScript SDK dependencies for browser E2E
        working-directory: packages/sdk-ts
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the Python SDK for the decision-grant browser test
        working-directory: packages/sdk-py
        run: pip install -e .
      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium
      - name: Test decision grants and passkey enrollment end to end in Chromium
        env:
          GRANTEX_E2E_PYTHON: python
        run: npm run test:e2e
      - name: Upload decision-grant browser screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: auth-service-decision-grant-screenshots
          path: apps/auth-service/test-results/
          if-no-files-found: ignore

  # The OACP conformance suite (packages/conformance, suite oacp) against a
  # live auth service: built from this checkout, on service-container
  # Postgres and Redis, with a per-run service token, an allowlisted tenant
  # and an auto-generated OACP issuer key. The SDK verifier and the runner are
  # installed from tarballs packed from this checkout, as a relying party
  # would install them.
  oacp-conformance:
    name: OACP Conformance (live auth service)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: grantex_oacp
          POSTGRES_PASSWORD: grantex_oacp
          POSTGRES_DB: grantex_oacp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantex_oacp -d grantex_oacp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_BASE_URL: http://127.0.0.1:3001
      OACP_CONFORMANCE_TENANT: cten_CONFORMANCE
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Build the auth service
        run: npm --prefix apps/auth-service ci --no-audit --no-fund && npm --prefix apps/auth-service run build
      - name: Pack the SDK and the conformance runner
        run: |
          mkdir -p "$RUNNER_TEMP/oacp-packs" "$RUNNER_TEMP/oacp-conformance"
          for pkg in packages/sdk-ts packages/conformance; do
            npm --prefix "$pkg" ci --no-audit --no-fund
            npm --prefix "$pkg" run build
            (cd "$pkg" && npm pack --pack-destination "$RUNNER_TEMP/oacp-packs")
          done
      - name: Install the runner beside the SDK verifier
        working-directory: ${{ runner.temp }}/oacp-conformance
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund --legacy-peer-deps "$RUNNER_TEMP"/oacp-packs/grantex-conformance-*.tgz "$RUNNER_TEMP"/oacp-packs/grantex-sdk-*.tgz
      - name: Generate per-run credentials
        run: |
          for name in COMMERCE_C6Z_AUTHORITY_SERVICE_TOKEN SEED_API_KEY ADMIN_API_KEY VAULT_ENCRYPTION_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start the auth service
        working-directory: apps/auth-service
        env:
          DATABASE_URL: postgres://grantex_oacp:grantex_oacp@127.0.0.1:5432/grantex_oacp
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: development
          LOG_PRETTY: "false"
          HOST: 127.0.0.1
          PORT: "3001"
          JWT_ISSUER: ${{ env.AUTH_BASE_URL }}
          PUBLIC_BASE_URL: ${{ env.AUTH_BASE_URL }}
          AUTO_GENERATE_KEYS: "true"
          COMMERCE_V1_ENABLED: "true"
          OACP_AUTO_GENERATE_ISSUER_KEY: "true"
          OACP_STATUS_LIST_PUBLIC_ENABLED: "true"
          OACP_ALLOW_LOOPBACK_HTTP: "true"
          COMMERCE_C6Z_AUTHORITY_SERVICE_TENANTS: ${{ env.OACP_CONFORMANCE_TENANT }}
        run: |
          nohup node dist/index.js > "$RUNNER_TEMP/auth-service.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "$AUTH_BASE_URL/health" > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "the auth service did not become healthy" >&2
          exit 1
      - name: Run the OACP conformance suite
        working-directory: ${{ runner.temp }}/oacp-conformance
        env:
          GRANTEX_CONFORMANCE_INTERNAL_TOKEN: ${{ env.COMMERCE_C6Z_AUTHORITY_SERVICE_TOKEN }}
        run: >-
          npx --no-install grantex-conformance --base-url "$AUTH_BASE_URL" --api-key "$SEED_API_KEY"
          --suite oacp --include oacp --oacp-issuer "$AUTH_BASE_URL" --oacp-tenant "$OACP_CONFORMANCE_TENANT"
      - name: Enrol a tenant through the service-tenant route, twice
        run: |
          tenant="$(cat /proc/sys/kernel/random/uuid)"
          body="{\"tenant_id\":\"$tenant\",\"merchant_id\":\"mch_CI_ENROL\",\"source_system\":\"catalog_upload\"}"
          for attempt in 1 2; do
            curl -fsS -X POST "$AUTH_BASE_URL/v1/commerce/oacp/service-tenants" \
              -H "authorization: Bearer $COMMERCE_C6Z_AUTHORITY_SERVICE_TOKEN" \
              -H 'content-type: application/json' -d "$body" > "$RUNNER_TEMP/enrolment.json"
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              const ok = r.status === "active" && r.merchant_ids.join() === "mch_CI_ENROL" && r.source_systems.join() === "catalog_upload";
              if (!ok) { console.error("unexpected enrolment", r); process.exit(1); }
            ' "$RUNNER_TEMP/enrolment.json"
          done
      - name: Auth service log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/auth-service.log" || true

  sdk-ts:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/sdk-ts/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  sdk-py:
    name: Python SDK — ${{ matrix.python-version }}
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9 build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    defaults:
      run:
        working-directory: packages/sdk-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Typecheck
        run: mypy --strict src/grantex
      - name: Test
        run: pytest
      # `make test` runs these on 3.12 (job "make"); this keeps the vendor
      # denylist check working on the oldest Python CONTRIBUTING.md supports.
      - name: Test repository scripts
        if: matrix.python-version == '3.9'
        working-directory: .
        run: python -m pytest -q tests/scripts

  # ─── Node packages that depend on @grantex/sdk ───────────────────────────
  #
  # Pattern: install root deps (provides vitest), build SDK, then test package.

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install root + SDK deps
        run: npm ci && cd packages/sdk-ts && npm ci && npm run build
      - name: Test CLI
        working-directory: packages/cli
        run: npm ci && npm run typecheck && npm test

  node-integrations:
    name: Node Integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install root + SDK deps
        run: npm ci && cd packages/sdk-ts && npm ci && npm run build
      - name: Test adapters
        working-directory: packages/adapters
        run: npm ci && npm run typecheck && npm test
      - name: Test gateway
        working-directory: packages/gateway
        run: npm ci && npm run typecheck && npm test
      - name: Test express
        working-directory: packages/express
        run: npm ci && npm run typecheck && npm test
      - name: Test langchain
        working-directory: packages/langchain
        run: npm ci && npm run typecheck && npm test
      - name: Test anthropic
        working-directory: packages/anthropic
        run: npm ci && npm run typecheck && npm test
      - name: Test autogen
        working-directory: packages/autogen
        run: npm ci && npm run typecheck && npm test
      - name: Test vercel-ai
        working-directory: packages/vercel-ai
        run: npm ci && npm run typecheck && npm test
      - name: Test a2a
        working-directory: packages/a2a
        run: npm ci && npm run typecheck && npm test
      - name: Test Strands
        working-directory: packages/strands
        run: npm ci && npm run typecheck && npm test

  mcp-packages:
    name: MCP Packages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: mcp_auth_test
          POSTGRES_PASSWORD: mcp_auth_test
          POSTGRES_DB: mcp_auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp_auth_test -d mcp_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The mcp-auth integration suite refuses to skip in CI.
      MCP_AUTH_INTEGRATION_DATABASE_URL: postgres://mcp_auth_test:mcp_auth_test@127.0.0.1:5432/mcp_auth_test
      MCP_AUTH_INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install root + SDK deps
        run: npm ci && cd packages/sdk-ts && npm ci && npm run build
      - name: Test MCP server
        working-directory: packages/mcp
        run: npm ci && npm run typecheck && npm test
      - name: Test patched body parser HTTP liveness
        run: |
          for directory in apps/mpp-demo-service examples/x402-weather-api packages/mpp packages/express packages/mcp-auth packages/x402; do
            npm ci --ignore-scripts --prefix "$directory"
          done
          node --test tests/scripts/body-parser.test.mjs
      - name: Test MCP auth
        working-directory: packages/mcp-auth
        run: npm ci && npm run typecheck && npm test
      - name: Test MCP auth against real Postgres and Redis (includes a server restart)
        working-directory: packages/mcp-auth
        run: npm run test:integration
      - name: Install Chromium for the MCP auth consent-page tests
        working-directory: packages/mcp-auth
        run: npx playwright install --with-deps chromium
      - name: Test the MCP auth consent page in Chromium (375 px layout, axe-core)
        working-directory: packages/mcp-auth
        run: npm run test:e2e
      - name: Upload consent-page screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcp-auth-consent-screenshots
          path: packages/mcp-auth/test-results/
          if-no-files-found: ignore

  compliance-packages:
    name: Compliance & Identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install root + SDK deps
        run: npm ci && cd packages/sdk-ts && npm ci && npm run build
      - name: Test DPDP
        working-directory: packages/dpdp
        run: npm ci && npm run typecheck && npm test
      - name: Test MPP
        working-directory: packages/mpp
        run: npm ci && npm run typecheck && npm test

  demos:
    name: Demos (attest, verify)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: grantex_demo
          POSTGRES_PASSWORD: grantex_demo
          POSTGRES_DB: grantex_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grantex_demo -d grantex_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://grantex_demo:grantex_demo@127.0.0.1:5432/grantex_demo
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install the mock issuer (root link, agent passport build)
        run: |
          npm ci --no-audit --no-fund
          npm --prefix packages/agent-passport ci --no-audit --no-fund
          npm --prefix packages/agent-passport run build
          npm --prefix packages/mock-issuer ci --no-audit --no-fund
      - name: Build the auth service
        run: npm --prefix apps/auth-service ci --no-audit --no-fund && npm --prefix apps/auth-service run build
      - name: Install the Python SDK and the relying-party verifier
        run: pip install -e packages/sdk-py -e packages/agent-passport-py -e packages/agent-httpsig-py -e "packages/verifier-py[dev]"
      - name: Run the attestation demo
        run: make demo-attest
      - name: Run the verification demo
        run: make demo-verify

  standalone-packages:
    name: Standalone Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install root deps
        run: npm ci
      - name: Test destinations
        working-directory: packages/destinations
        run: npm ci && npm run typecheck && npm test
      - name: Test conformance
        working-directory: packages/conformance
        run: npm ci && npm run typecheck && npm test
      - name: Test gemma
        working-directory: packages/gemma
        run: npm ci && npm run typecheck && npm test
      - name: Test agent-passport
        working-directory: packages/agent-passport
        run: npm ci && npm run typecheck && npm test
      - name: Build agent-passport (the mock issuer resolves it from the local build)
        working-directory: packages/agent-passport
        run: npm run build
      - name: Test mock issuer
        working-directory: packages/mock-issuer
        run: npm ci && npm run typecheck && npm test
      - name: Test x402
        working-directory: packages/x402
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Test agent-httpsig
        working-directory: packages/agent-httpsig
        run: npm ci && npm run typecheck && npm test && npm run build
      - name: Typecheck official x402 weather resource example
        working-directory: examples/x402-weather-api
        run: npm ci && npm run typecheck

  # ─── Python integration packages ─────────────────────────────────────────

  python-integrations:
    name: Python Integrations — ${{ matrix.python-version }}
    runs-on: ubuntu-24.04  # ubuntu-latest (26.04) has no Python 3.9 build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python SDK
        working-directory: packages/sdk-py
        run: pip install -e ".[dev]"
      - name: Test FastAPI middleware
        working-directory: packages/fastapi
        run: pip install -e ".[dev]" && mypy --strict src && pytest
      - name: Test relying-party verifier Python
        working-directory: packages/verifier-py
        run: pip install -e ../agent-passport-py -e ../agent-httpsig-py -e ".[dev]" && mypy --strict src && pytest
      - name: Test CrewAI integration
        working-directory: packages/crewai
        run: pip install -e ".[dev]" && mypy --strict src && pytest
      - name: Test OpenAI Agents
        working-directory: packages/openai-agents
        run: pip install -e ".[dev]" && mypy --strict src && pytest
      - name: Test Google ADK
        working-directory: packages/google-adk
        run: pip install -e ".[dev]" && mypy --strict src && pytest
      - name: Test A2A Python
        working-directory: packages/a2a-py
        run: pip install -e ".[dev]" && mypy --strict src && pytest
      - name: Test Gemma Python
        working-directory: packages/gemma-py
        run: pip install -e ".[dev]" && mypy --strict src && pytest
      - name: Test Agent Passport Python
        working-directory: packages/agent-passport-py
        run: pip install -e ".[dev]" && mypy --strict src && pytest
      - name: Test agent-httpsig Python
        working-directory: packages/agent-httpsig-py
        run: pip install -e ".[dev]" && mypy --strict src && pytest
      - name: Test Strands Python
        if: matrix.python-version != '3.9'
        working-directory: packages/strands-py
        run: pip install -e ".[dev]" && mypy --strict src && pytest

  portal:
    name: Developer Portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # ─── TypeScript examples ─────────────────────────────────────────────────
  #
  # Install and typecheck each example against the published package shape,
  # but never call `npm start` (which would reach a running Grantex API).
  # This catches stale example dependency pins and integration API drift.
  typescript-examples:
    name: Example (registry) — ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [adapter-google-calendar, anthropic-tool-use, audit-dashboard, gateway-proxy, langchain-agent, multi-agent-delegation, multi-agent-email-flow, quickstart-ts, token-expiry-refresh, vercel-ai-chatbot, x402-agent-demo]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install (resolves @grantex/sdk against the public registry)
        run: npm install --no-audit --no-fund
      - name: Typecheck (no network calls)
        run: npm run typecheck

  typescript-examples-local:
    name: Examples — checkout package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Prepare package artifacts
        run: mkdir -p "$RUNNER_TEMP/grantex-packs"
      - name: Build and pack checkout SDK
        working-directory: packages/sdk-ts
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP/grantex-packs"
      - name: Build and pack checkout LangChain integration
        working-directory: packages/langchain
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP/grantex-packs"
      - name: Build and pack checkout Vercel AI integration
        working-directory: packages/vercel-ai
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP/grantex-packs"
      - name: Typecheck quickstart against checkout SDK
        working-directory: examples/quickstart-ts
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/grantex-packs/grantex-sdk-*.tgz
          npm run typecheck
      - name: Typecheck LangChain example against checkout packages
        working-directory: examples/langchain-agent
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/grantex-packs/grantex-sdk-*.tgz "$RUNNER_TEMP"/grantex-packs/grantex-langchain-*.tgz
          npm run typecheck
      - name: Typecheck Vercel AI example against checkout packages
        working-directory: examples/vercel-ai-chatbot
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/grantex-packs/grantex-sdk-*.tgz "$RUNNER_TEMP"/grantex-packs/grantex-vercel-ai-*.tgz
          npm run typecheck

  nextjs-example:
    name: Example — nextjs-starter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/nextjs-starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/nextjs-starter/package-lock.json
      - run: npm ci
      - run: npm run build

  go:
    name: Go SDK, Provider & Example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            packages/go-sdk/go.sum
            packages/terraform-provider-grantex/go.sum
            examples/quickstart-go/go.sum
      - name: Test Go SDK
        working-directory: packages/go-sdk
        run: go test ./...
      - name: Build Terraform provider
        working-directory: packages/terraform-provider-grantex
        run: go test ./...
      - name: Build quickstart
        working-directory: examples/quickstart-go
        run: go test ./...
